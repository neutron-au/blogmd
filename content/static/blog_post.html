<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta property="og:title" content="{{ blog.title }}" />
        <meta property="og:description" content="{{ blog.description }}" />
        <meta property="og:author" content="{{ author.name }}" />
        <meta property="og:image" content="{{ author.avatar }}" />
        <meta property="og:site_name" content="Mitch Naake" />
        
        <title>{{ blog.title }}</title>
        <!-- Fonts: preconnect first, then load async via print trick -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
        <noscript>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap">
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap">
        </noscript>

        <!-- highlight.js CSS: already async, no change needed -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="print" onload="this.media='all'; this.onload=null;">
        <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"></noscript>
        <!-- highlight.js JS: already async, no change needed -->
        <script async  onload="hljs.highlightAll()" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        
        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [['\\(', ')\\']],
                    displayMath: [['$', '$']]
                },
                options: {
                    makeCollapsible: false,
                    enableMenu: false,
                    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                    menuOptions: {
                        settings: {
                            enrich: false,
                        }
                    }
                }
            };
        </script>
        <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/4.1.3/tex-mml-svg.min.js"></script>

        <!-- our stylesheet -->
        <link rel="stylesheet" href="/static/stylesheet.css"/>

    </head>
    <body class="document">
        <div class="content">
            {{ header_html }}
            <hr>
            {{ blog_html }}
        </div>
    </body>
<!-- <script>hljs.highlightAll();</script> -->
</html>
